<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2f4a"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </radialGradient>
    <linearGradient id="bookLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8edec"/>
      <stop offset="100%" stop-color="#6cd2d1"/>
    </linearGradient>
    <linearGradient id="bookRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6cd2d1"/>
      <stop offset="100%" stop-color="#3db8b7"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a9090"/>
      <stop offset="100%" stop-color="#3db8b7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6cd2d1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>

  <!-- Glow halo behind book -->
  <ellipse cx="50" cy="54" rx="32" ry="18" fill="#6cd2d1" opacity="0.08"/>

  <!-- Book group with glow -->
  <g filter="url(#softShadow)">
    <!-- Left page -->
    <path d="M50 30 L22 38 L22 72 L50 65 Z" fill="url(#bookLeft)" opacity="0.95"/>
    <!-- Right page -->
    <path d="M50 30 L78 38 L78 72 L50 65 Z" fill="url(#bookRight)" opacity="0.9"/>
    <!-- Spine -->
    <rect x="47.5" y="29" width="5" height="37" rx="2" fill="url(#spineGrad)"/>
  </g>

  <!-- Page lines on left -->
  <line x1="31" y1="46" x2="47" y2="43" stroke="white" stroke-width="1.2" stroke-opacity="0.35" stroke-linecap="round"/>
  <line x1="31" y1="52" x2="47" y2="49" stroke="white" stroke-width="1.2" stroke-opacity="0.35" stroke-linecap="round"/>
  <line x1="31" y1="58" x2="47" y2="55" stroke="white" stroke-width="1.2" stroke-opacity="0.25" stroke-linecap="round"/>

  <!-- Page lines on right -->
  <line x1="53" y1="43" x2="69" y2="46" stroke="white" stroke-width="1.2" stroke-opacity="0.25" stroke-linecap="round"/>
  <line x1="53" y1="49" x2="69" y2="52" stroke="white" stroke-width="1.2" stroke-opacity="0.25" stroke-linecap="round"/>
  <line x1="53" y1="55" x2="69" y2="58" stroke="white" stroke-width="1.2" stroke-opacity="0.18" stroke-linecap="round"/>

  <!-- Highlight on left page top edge -->
  <path d="M50 30 L22 38 L26 39 L50 32 Z" fill="white" opacity="0.2"/>
</svg>